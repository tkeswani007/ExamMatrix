<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Matrix | Authentication Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --emerald-600: #059669;
            --emerald-50: #ecfdf5;
            --rose-600: #e11d48;
            --rose-50: #fef2f2;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow-lg: 0 20px 40px -10px rgba(15, 23, 42, 0.08);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--slate-100);
            color: var(--slate-900);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        h1, h2, h3, h4, .brand-text {
            font-family: 'Outfit', sans-serif;
        }

        .auth-card {
            background-color: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--slate-200);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .auth-header {
            text-align: center;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--slate-900);
            letter-spacing: -0.02em;
            margin-top: 12px;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: var(--slate-500);
            font-weight: 600;
            margin-top: 4px;
        }

        .tab-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            background-color: var(--slate-50);
            padding: 6px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--slate-200);
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px;
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--slate-500);
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
        }

        .tab-btn.active {
            background-color: #ffffff;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.725rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--slate-500);
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background-color: var(--slate-50);
            border: 2px solid var(--slate-200);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            color: var(--slate-900);
            font-family: inherit;
            font-weight: 600;
            transition: var(--transition);
        }

        input:hover {
            border-color: var(--slate-300);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #ffffff;
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            transition: var(--transition);
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--primary-hover), #3730a3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.5);
        }

        #errorMsg {
            background-color: var(--rose-50);
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Exam Matrix</h1>
            <p class="auth-subtitle">Intelligent Seat Allocation Management</p>
        </div>

        <div class="tab-group">
            <button id="loginTab" onclick="switchTab('login')" class="tab-btn active">Admin Login</button>
            <button id="signupTab" onclick="switchTab('signup')" class="tab-btn">Create Account</button>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div id="nameField" class="form-group hidden">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="e.g. Administrator">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@exammatrix.edu" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter secure password" required minlength="6">
            </div>
            <button type="submit" id="submitBtn" class="btn-submit">Authenticate Portal</button>
            <p id="errorMsg" class="hidden"></p>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api/auth';
        let isLoginMode = true;

        function switchTab(mode) {
            isLoginMode = (mode === 'login');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const nameField = document.getElementById('nameField');
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.add('hidden');

            if (isLoginMode) {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                nameField.classList.add('hidden');
                document.getElementById('name').removeAttribute('required');
                submitBtn.textContent = "Authenticate Portal";
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                nameField.classList.remove('hidden');
                document.getElementById('name').setAttribute('required', 'true');
                submitBtn.textContent = "Register Admin Account";
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const name = document.getElementById('name').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = isLoginMode ? "Authenticating..." : "Registering Account...";

            const endpoint = isLoginMode ? `${API_BASE_URL}/login` : `${API_BASE_URL}/register`;
            const payload = isLoginMode ? { username: emailInput, password } : { username: emailInput, name, password };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || data.success === false) {
                    throw new Error(data.message || (isLoginMode ? "Invalid username or password." : "Registration failed."));
                }

                if (isLoginMode) {
                    window.location.href = "index.html";
                } else {
                    alert("Account registered successfully! Please log in with your credentials.");
                    switchTab('login');
                    document.getElementById('authForm').reset();
                }
            } catch (error) {
                console.error("Auth error:", error);
                errorMsg.textContent = error.message || "Connection error. Ensure backend is running on port 8080.";
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isLoginMode ? "Authenticate Portal" : "Register Admin Account";
            }
        }
    </script>
</body>
</html>
